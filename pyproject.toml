[project]
name = "isatools"
version = "0.14.3"
description = "Metadata tracking tools help to manage an increasingly diverse set of life science, environmental and biomedical experiments"
readme = "README.md"
requires-python = ">=3.11.5,<4"

license = "CPAL-1.0"
license-files = ["LICENSE.txt"]

authors = [
        { name = "ISA Infrastructure Team", email = "isatools@googlegroups.com" },
]
keywords = []


classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: System Administrators",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "setuptools>=77.0.3,<81",
    'numpy~=2.2.4 ; python_version >= "3.10" and python_version < "3.14"',
    'numpy>=2.3.3,<3 ; python_version >= "3.14"',
    'networkx>=3.2,<3.3 ; python_version < "3.10"',
    'networkx>=3.4.2 ; python_version >= "3.10"',
    'jsonschema>=4.26.0,<5 ; python_version >= "3.10"',
    'jsonschema>=4.25.0,<4.26.0 ; python_version < "3.10"',
    'pandas>=2.2.3,<3.0.0 ; python_version < "3.15"',
    'pandas>=3.1.1,<4.0.0 ; python_version >= "3.15"',
    "openpyxl>=3.1.5",
    "lxml>=6.1.3",
    'requests>=2.34.0 ; python_version >= "3.10"',
    'requests>=2.32.0 ; python_version < "3.10"',
    "iso8601>=2.1.0",
    'chardet>=7.7.0 ; python_version >= "3.10"',
    'chardet>=5.0.0,<6.0.0 ; python_version < "3.10"',
    "jinja2>=3.1.4",
    "beautifulsoup4>=4.15.0",
    "soupsieve>=4.1.3",
    "ddt~=1.7.2",
    'deepdiff>=9.2.1 ; python_version >= "3.11"',
    'deepdiff~=8.6.1 ; python_version < "3.11"',
    "mzml2isa==1.1.1",
    'biopython>=1.88 ; python_version >= "3.10"',
    'biopython>=1.85,<1.86 ; python_version < "3.10"',
    'progressbar2>=4.7.1 ; python_version >= "3.10"',
    'progressbar2>=4.5.0 ; python_version < "3.10"',
    "PyYAML>=6.0.3",
    "rdflib>=7.6.0",
    "python-dateutil>=2.9.0.post0",
    "graphene>=3.4.3,<4.0.0",
    "pronto>=2.7.4",
    "fastobo>=0.14.2",
    'rpds-py>=2026.9.1 ; python_version >= "3.11"',
    'contourpy>=1.4.0 ; python_version >= "3.12"',
]

[project.optional-dependencies]
notebook = [
    'bokeh>=3.10.2 ; python_version >= "3.12"',
    'bokeh>=3.4.2 ; python_version < "3.12"',
    'pillow>=12.0.0,<13.0.0 ; python_version >= "3.12" and python_version < "3.15"',
    'pillow>=13.0.0 ; python_version >= "3.15"',
    'pillow<=12.0.0 ; python_version < "3.12"',
]
pydantic = [
    'pydantic>=2.14.4 ; python_version >= "3.10"',
    'pydantic>=2.12 ; python_version < "3.10"',

]
jsonld = [
    'PyLD>=3.3.0 ; python_version >= "3.10"',
    "rdflib>=7.6.0",
]
dev = [
    "ruff>=0.15.20",
    "pytest-timeout>=2.4.0",
    'pytest>=9.2.0 ; python_version >= "3.10"',
    'pytest>=8.4.0,<=8.4.1 ; python_version < "3.10"',
    'coveralls>=4.1.0 ; python_version >= "3.10"',
    'coveralls>=4.0.1 ; python_version < "3.10"',
    "ddt>=1.7.2",

    "behave>=1.2.6",
    "httpretty>=1.1.4",
    'import-linter>=2.15 ; python_version >= "3.10"',
    'import-linter<2.5.2 ; python_version < "3.10"',
    'pre-commit>=4.7.0 ; python_version >= "3.11"',
    'pre-commit>4.0.0,<=4.3.0 ; python_version < "3.11"',
]
database = [
    "Flask>=3.1.1",
    "flask_sqlalchemy>=3.0.2",
    "SQLAlchemy~=2.0.31"
]
all = ["isatools[database,notebook,pydantic,jsonld]"]

[project.urls]
Code = "https://github.com/ISA-tools/isa-api"
"Bug Tracker" = "https://github.com/ISA-tools/isa-api/issues"
Changelog = "https://github.com/ISA-tools/isa-api/issues"
Documentation = "https://isa-tools.org/isa-api/content/index.html"
Coverage = "https://coveralls.io/github/ISA-tools/isa-api?branch=master"
CI = "https://github.com/ISA-tools/isa-api/actions"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "isatools"
module-root = ""


[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
addopts = "-ra -q -v"

testpaths = [
    "tests"
]
python_files = ["test_*.py", "*_test.py"]


[tool.ruff]
target-version = "py39"
line-length = 120
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore= ["F401", "F403", "F541", "F841", "F405", "G003", "F821"]
fixable = ["ALL"]

[tool.importlinter]
include_external_packages = true
root_packages = ["isatools"]

[[tool.importlinter.contracts]]
name = "Architecture Layer Dependencies"
type = "layers"
layers = [
    "isatools.convert",
    "isatools.isajson",
    "isatools.isatab",
    "isatools.model"
]

[[tool.importlinter.contracts]]
name = "Restricted External Package Imports - Flask, SQLAlchemy"
description = "Use flask and sqlalchemy packages only for database related utilities"
type = "forbidden"
source_modules = [
   "isatools"
]
forbidden_modules = [
    "flask",
    "sqlalchemy"
]
ignore_imports = [
    "isatools.database.models.** -> sqlalchemy",
    "isatools.database.utils -> flask"
]

[[tool.importlinter.contracts]]
name = "Restricted Development Package Imports"
type = "forbidden"
source_modules = [
   "isatools"
]
forbidden_modules = [
    "bokeh", "coveralls", "pytest", "behave"
]
ignore_imports = [

]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
