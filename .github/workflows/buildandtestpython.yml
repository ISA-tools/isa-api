name: Python package

on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Download Test Data
      run: |
        bash -x get_test_data.sh
    - name: Install uv
      uses: astral-sh/setup-uv@v6.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes libxml2-dev libxslt1-dev
    - name: Sync dependencies
      run: |
        uv sync --extra database --extra dev
    - name: Check with Ruff
      run: uv run --locked --extra all --extra dev ruff check --config pyproject.toml
    - name: Format with Ruff
      run: uv run --locked --extra all --extra dev ruff format --config pyproject.toml
    - name: Test with python unittest
      run: |
        uv run pytest
        uv run coverage run -m unittest discover -s tests/
        uv run coverage report -m
    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true
        flag-name: Unit Test

  coveralls_finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
